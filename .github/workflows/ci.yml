name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: ./target/aarch64-apple-darwin/release/voice-journal --check
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/voice-journal dist/
          cp scripts/install-launchd.sh dist/
          tar -czf voice-journal-aarch64-apple-darwin.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: voice-journal-aarch64-apple-darwin
          path: voice-journal-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voice-journal-aarch64-apple-darwin
          path: release
      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="main-${GITHUB_SHA}"
          archive="release/voice-journal-aarch64-apple-darwin.tar.gz"
          test -s "$archive"
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == "true" ]]; then
              gh release upload "$tag" "$archive" --clobber
              gh release edit "$tag" --draft=false
            else
              echo "Release $tag is already published."
            fi
          else
            gh release create "$tag" "$archive" \
              --target "$GITHUB_SHA" \
              --title "Voice Journal ${GITHUB_SHA:0:12}" \
              --notes "macOS Apple Silicon build of commit ${GITHUB_SHA}. Requires macOS 14+ and TypeWhisper 1.6+. See the README for installation."
          fi
